name: umrahapp
description: "Umrah Registration App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  flutter_bloc: ^9.1.1
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  http: ^1.5.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  flutter_tts: ^4.2.3
  equatable: ^2.0.7
  flutter_markdown: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf